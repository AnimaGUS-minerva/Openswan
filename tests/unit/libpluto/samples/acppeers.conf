config setup

conn %default
        ikelifetime=60m
        keylife=20m
        rekeymargin=3m
        keyingtries=1
        ikev2=insist

# A = dave
# B = carol
# C = bob
# stupid assignments, eh?

conn peerA--peerB
        overlapip=true
        left=fe80::8054:3eff:fe9a:d3f4
        leftcert=daveCert.pem
        leftid=%cert
        leftsubnet=::/0
        leftca="C=CA, ST=ON, L=Ottawa, O=Xelerance, CN=Openswan Unit Testing Root CA"
        leftsendcert=always
        leftifid=4567
        right=fe80::ec68:7cff:fe0c:9aa4
        rightid="C=CA, ST=ON, O=Xelerance, CN=*"
        rightsubnet=::/0
        rightca=%same
        rightsendcert=always
        rightifid=6789
        clientaddrfamily=ipv6
        auto=add

conn peerA--peerC
        overlapip=true
        left=fe80::8054:3eff:fe9a:d3f4
        leftcert=daveCert.pem
        leftid=%cert
        leftsubnet=::/0
        leftca="C=CA, ST=ON, L=Ottawa, O=Xelerance, CN=Openswan Unit Testing Root CA"
        leftsendcert=always
        leftifid=3347
        right=fe80::ec68:7cff:fe0c:1c1c
        rightid="C=CA, ST=ON, O=Xelerance, CN=*"
        rightsubnet=::/0
        rightca=%same
        rightsendcert=always
        rightifid=8932
        clientaddrfamily=ipv6
        auto=add

conn peerB--peerA-base
        overlapip=true
        # left is peer A
        leftid="C=CA, ST=ON, O=Xelerance, CN=*"
        leftca=%same
        leftsubnet=::/0
        leftsendcert=always
        # right is peer B
        right=fe80::ec68:7cff:fe0c:9aa4
        rightid=%cert
        rightcert=carolCert.pem
        rightsubnet=::/0
        rightca="C=CA, ST=ON, L=Ottawa, O=Xelerance, CN=Openswan Unit Testing Root CA"
        rightsendcert=always
        clientaddrfamily=ipv6

conn peerB--peerA
        left=fe80::8054:3eff:fe9a:d3f4
        leftifid=1234
        rightifid=9987
        also=peerB--peerA-base
        auto=add

# this is same as peerB, but it has a different IP address.
conn peerB-other--peerA
        also=peerB--peerA-base
        # left is peer A, different IP address than above to check policy parser
        left=fe80::8054:3eff:fe9a:bad0
        leftifid=1235
        rightifid=9987
        auto=add

conn peerC--peerA
        overlapip=true
        # left is peer A
        left=fe80::8054:3eff:fe9a:d3f4
        leftid="C=CA, ST=ON, O=Xelerance, CN=*"
        leftca=%same
        leftsubnet=::/0
        leftsendcert=always
        leftifid=3347
        # left is peer C
        right=fe80::ec68:7cff:fe0c:1c1c
        rightid=%cert
        rightcert=bobCert.pem
        rightsubnet=::/0
        rightca="C=CA, ST=ON, L=Ottawa, O=Xelerance, CN=Openswan Unit Testing Root CA"
        rightsendcert=always
        rightifid=8932
        clientaddrfamily=ipv6
        auto=add

